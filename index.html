<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف - تصوير وقص البطاقة تلقائياً</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-id-card"></i> نظام تصوير البطاقة (قص تلقائي دقيق)
        </h1>
        <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">النسخة المعدلة</span>
    </header>

    <main class="max-w-3xl mx-auto p-6 flex flex-col gap-6 mt-4">

        <!-- قسم الكاميرا -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center">
            <h2 id="cameraTitle" class="font-bold text-lg text-blue-900 mb-3 w-full text-right border-b pb-2">تصوير الوجه الأمامي للبطاقة</h2>
            
            <div class="w-full max-w-lg bg-black rounded-lg overflow-hidden relative aspect-[16/10] flex items-center justify-center border-2 border-blue-900 shadow-inner">
                <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
                
                <!-- إطار توجيهي بصري للبطاقة -->
                <div class="absolute border-2 border-yellow-400 rounded-lg w-[85%] h-[75%] pointer-events-none flex items-center justify-center bg-yellow-400/5 shadow-lg">
                    <span class="absolute top-2 right-2 bg-black/70 text-yellow-300 text-[10px] px-2 py-0.5 rounded">ضع البطاقة هنا</span>
                </div>
            </div>

            <div class="flex gap-4 mt-4 w-full max-w-lg">
                <button id="captureFrontBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-bold transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> التقاط الأمامي تلقائياً
                </button>
                <button id="captureBackBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-lg font-bold transition shadow flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-camera-rotate"></i> التقاط الخلفي تلقائياً
                </button>
            </div>
        </div>

        <!-- معاينة الصور الملتقطة -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="border rounded-xl p-3 flex flex-col items-center bg-gray-50">
                <p class="text-xs font-bold text-gray-700 mb-2"><i class="fa-solid fa-image text-blue-600 ml-1"></i> الوجه الأمامي (المقصوص)</p>
                <div id="frontPreview" class="text-gray-400 text-xs text-center py-6">لم يتم الالتقاط بعد</div>
            </div>
            <div class="border rounded-xl p-3 flex flex-col items-center bg-gray-50">
                <p class="text-xs font-bold text-gray-700 mb-2"><i class="fa-solid fa-image text-indigo-600 ml-1"></i> الوجه الخلفي (المقصوص)</p>
                <div id="backPreview" class="text-gray-400 text-xs text-center py-6">لم يتم الالتقاط بعد</div>
            </div>
        </div>

        <!-- زر الدمج والتصدير النهائي -->
        <button id="generatePdfBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 px-6 rounded-xl font-bold text-lg shadow transition disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
            <i class="fa-solid fa-file-pdf"></i> دمج وجهي البطاقة في ملف PDF وتحميله
        </button>

    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const cameraTitle = document.getElementById('cameraTitle');

        const captureFrontBtn = document.getElementById('captureFrontBtn');
        const captureBackBtn = document.getElementById('captureBackBtn');
        const frontPreview = document.getElementById('frontPreview');
        const backPreview = document.getElementById('backPreview');

        let frontImageBlob = null;
        let backImageBlob = null;

        // تشغيل الكاميرا بدقة عالية
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (e) {
                    alert('تعذر تشغيل الكاميرا.');
                }
            }
        }
        initCamera();

        // دالة القص التلقائي الحقيقي بناءً على أبعاد الفيديو والنسبة الذهبية للبطاقة
        function captureAndCropAutomatically() {
            const videoWidth = video.videoWidth || 1280;
            const videoHeight = video.videoHeight || 720;

            // تحديد مساحة القص بالمنتصف بنسبة أبعاد البطاقة المدنية الصحيحة (العرض 80%، والارتفاع يناسب نسب البطاقة الأفقية)
            const cropW = Math.floor(videoWidth * 0.80);
            const cropH = Math.floor(cropW / 1.58); // نسبة أبعاد البطاقة الرسمية

            const cropX = Math.floor((videoWidth - cropW) / 2);
            const cropY = Math.floor((videoHeight - cropH) / 2);

            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');

            // قص الجزء الأوسط من دقة الكاميرا الأصلية مباشرة
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) { u8arr[n] = bstr.charCodeAt(n); }
            
            return { blob: new Blob([u8arr], {type: mime}), dataUrl };
        }

        captureFrontBtn.addEventListener('click', () => {
            const res = captureAndCropAutomatically();
            frontImageBlob = res.blob;
            frontPreview.innerHTML = `<img src="${res.dataUrl}" class="h-28 object-contain rounded shadow border">`;
            
            captureFrontBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم التقاط الأمامي';
            captureFrontBtn.classList.replace('bg-blue-600', 'bg-green-600');
            captureBackBtn.disabled = false;
            cameraTitle.textContent = "تصوير الوجه الخلفي للبطاقة";
        });

        captureBackBtn.addEventListener('click', () => {
            const res = captureAndCropAutomatically();
            backImageBlob = res.blob;
            backPreview.innerHTML = `<img src="${res.dataUrl}" class="h-28 object-contain rounded shadow border">`;
            
            captureBackBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم التقاط الخلفي';
            captureBackBtn.classList.replace('bg-indigo-600', 'bg-green-600');
            
            if (frontImageBlob && backImageBlob) {
                generatePdfBtn.disabled = false;
            }
            cameraTitle.textContent = "تم قص وتجهيز وجهي البطاقة بنجاح";
        });

        generatePdfBtn.addEventListener('click', async () => {
            generatePdfBtn.disabled = true;
            generatePdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري دمج البطاقة...';

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();
                const page = pdfDoc.addPage([595.28, 841.89]);

                const frontBytes = await frontImageBlob.arrayBuffer();
                const backBytes = await backImageBlob.arrayBuffer();

                const frontImage = await pdfDoc.embedJpg(frontBytes);
                const backImage = await pdfDoc.embedJpg(backBytes);

                const cardWidth = 420;
                const cardHeight = 420 * (frontImage.height / frontImage.width);

                page.drawImage(frontImage, { x: (595.28 - cardWidth) / 2, y: 450, width: cardWidth, height: cardHeight });
                page.drawImage(backImage, { x: (595.28 - cardWidth) / 2, y: 150, width: cardWidth, height: cardHeight });

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Civil_ID_AutoCropped_' + Date.now() + '.pdf';
                link.click();

                alert('تم قص البطاقة تلقائياً ودمجها بملف الـ PDF بنجاح!');
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء دمج البطاقة.');
            } finally {
                generatePdfBtn.disabled = false;
                generatePdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> دمج وجهي البطاقة في ملف PDF وتحميله';
            }
        });
    </script>
</body>
</html>
