<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تصوير ودمج المستندات والبطاقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-camera-retro"></i> منصة الأرشيف الذكي (كاميرا ومستندات)
        </h1>
        <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">نسخة متطورة</span>
    </header>

    <main class="max-w-4xl mx-auto p-6 flex flex-col gap-6 mt-4">

        <!-- اختيار وضع العمل -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-center gap-4">
            <button id="modeCivilId" onclick="switchMode('civil')" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white transition shadow-sm">
                <i class="fa-solid fa-id-card ml-1"></i> وضع البطاقة المدنية (وجهين)
            </button>
            <button id="modeDocs" onclick="switchMode('docs')" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 transition shadow-sm">
                <i class="fa-solid fa-file-lines ml-1"></i> وضع المستندات المتعددة
            </button>
        </div>

        <!-- قسم الكاميرا -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center">
            <h2 id="cameraTitle" class="font-bold text-lg text-blue-900 mb-3 w-full text-right border-b pb-2">الكاميرا - تصوير الوجه الأمامي</h2>
            
            <div class="w-full max-w-md bg-black rounded-lg overflow-hidden relative aspect-video flex items-center justify-center">
                <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <!-- أزرار التحكم الخاصة بالبطاقة -->
            <div id="civilControls" class="flex gap-4 mt-4 w-full max-w-md">
                <button id="captureFrontBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-lg font-medium transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> تصوير الأمامي
                </button>
                <button id="captureBackBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-4 rounded-lg font-medium transition shadow-sm flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-camera-rotate"></i> تصوير الخلفي
                </button>
            </div>

            <!-- أزرار التحكم الخاصة بالمستندات المتعددة -->
            <div id="docsControls" class="flex gap-4 mt-4 w-full max-w-md hidden">
                <button id="capturePageBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-4 rounded-lg font-medium transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> التقاط صفحة جديدة
                </button>
            </div>
        </div>

        <!-- قسم المعاينة -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <h3 class="font-bold text-md text-blue-900 mb-3 border-b pb-2">الملفات الملتقطة حالياً:</h3>
            <div id="previewContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <p class="text-xs text-gray-400 col-span-full text-center py-4">لم يتم التقاط أي صور بعد</p>
            </div>
        </div>

        <!-- زر الدمج والتصدير النهائي -->
        <button id="generatePdfBtn" class="w-full bg-blue-900 hover:bg-blue-800 text-white py-3 px-6 rounded-xl font-bold text-lg shadow transition disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
            <i class="fa-solid fa-file-pdf"></i> دمج وتصدير الكل إلى ملف PDF
        </button>

    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        const previewContainer = document.getElementById('previewContainer');

        const modeCivilBtn = document.getElementById('modeCivilId');
        const modeDocsBtn = document.getElementById('modeDocs');
        const civilControls = document.getElementById('civilControls');
        const docsControls = document.getElementById('docsControls');
        const cameraTitle = document.getElementById('cameraTitle');

        const captureFrontBtn = document.getElementById('captureFrontBtn');
        const captureBackBtn = document.getElementById('captureBackBtn');
        const capturePageBtn = document.getElementById('capturePageBtn');

        let currentMode = 'civil'; // 'civil' أو 'docs'
        let civilImages = { front: null, back: null };
        let multiPages = [];

        // تشغيل الكاميرا
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert('تعذر الوصول للكاميرا، تأكد من إعطاء الصلاحية أو تشغيل الموقع عبر اتصال آمن HTTPS.');
            }
        }
        initCamera();

        // تبديل الوضع (بطاقة مدنية / مستندات متعددة)
        function switchMode(mode) {
            currentMode = mode;
            civilImages = { front: null, back: null };
            multiPages = [];
            updatePreviewUI();
            generatePdfBtn.disabled = true;

            if (mode === 'civil') {
                modeCivilBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white transition shadow-sm";
                modeDocsBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 transition shadow-sm";
                civilControls.classList.remove('hidden');
                docsControls.classList.add('hidden');
                cameraTitle.textContent = "الكاميرا - تصوير الوجه الأمامي للبطاقة";
                captureFrontBtn.disabled = false;
                captureFrontBtn.innerHTML = '<i class="fa-solid fa-camera"></i> تصوير الأمامي';
                captureBackBtn.disabled = true;
                captureBackBtn.innerHTML = '<i class="fa-solid fa-camera-rotate"></i> تصوير الخلفي';
            } else {
                modeDocsBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-emerald-600 text-white transition shadow-sm";
                modeCivilBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-gray-200 text-gray-700 transition shadow-sm";
                docsControls.classList.remove('hidden');
                civilControls.classList.add('hidden');
                cameraTitle.textContent = "الكاميرا - التقاط صفحات المستند (مستند متعدد الصفحات)";
            }
        }

        // التقاط صورة عبر الـ Canvas
        function captureFrameBlob() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) { u8arr[n] = bstr.charCodeAt(n); }
            return { blob: new Blob([u8arr], {type: mime}), dataUrl };
        }

        // أزرار التقاط البطاقة
        captureFrontBtn.addEventListener('click', () => {
            const res = captureFrameBlob();
            civilImages.front = res.blob;
            captureFrontBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم تصوير الأمامي';
            captureBackBtn.disabled = false;
            cameraTitle.textContent = "الكاميرا - تصوير الوجه الخلفي للبطاقة";
            updatePreviewUI();
        });

        captureBackBtn.addEventListener('click', () => {
            const res = captureFrameBlob();
            civilImages.back = res.blob;
            captureBackBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم تصوير الخلفي';
            if (civilImages.front && civilImages.back) {
                generatePdfBtn.disabled = false;
            }
            updatePreviewUI();
        });

        // زر التقاط صفحة للمستندات المتعددة
        capturePageBtn.addEventListener('click', () => {
            const res = captureFrameBlob();
            multiPages.push(res.blob);
            if (multiPages.length > 0) {
                generatePdfBtn.disabled = false;
            }
            updatePreviewUI();
        });

        // تحديث الواجهة والمعاينات
        function updatePreviewUI() {
            previewContainer.innerHTML = '';
            
            if (currentMode === 'civil') {
                if (civilImages.front) {
                    appendPreviewItem('الوجه الأمامي', URL.createObjectURL(civilImages.front));
                }
                if (civilImages.back) {
                    appendPreviewItem('الوجه الخلفي', URL.createObjectURL(civilImages.back));
                }
                if (!civilImages.front && !civilImages.back) {
                    previewContainer.innerHTML = '<p class="text-xs text-gray-400 col-span-full text-center py-4">لم يتم التقاط أي صور للبطاقة بعد</p>';
                }
            } else {
                if (multiPages.length === 0) {
                    previewContainer.innerHTML = '<p class="text-xs text-gray-400 col-span-full text-center py-4">لم يتم التقاط أي صفحات بعد</p>';
                } else {
                    multiPages.forEach((blob, idx) => {
                        appendPreviewItem(`الصفحة (${idx + 1})`, URL.createObjectURL(blob));
                    });
                }
            }
        }

        function appendPreviewItem(label, url) {
            const div = document.createElement('div');
            div.className = 'border rounded-lg p-2 flex flex-col items-center bg-gray-50';
            div.innerHTML = `
                <span class="text-xs font-bold text-gray-600 mb-1">${label}</span>
                <img src="${url}" class="h-24 object-cover rounded shadow">
            `;
            previewContainer.appendChild(div);
        }

        // زر التصدير والدمج النهائي لملف الـ PDF
        generatePdfBtn.addEventListener('click', async () => {
            generatePdfBtn.disabled = true;
            generatePdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء ملف PDF...';

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();

                if (currentMode === 'civil') {
                    const page = pdfDoc.addPage([595.28, 841.89]); // A4
                    const frontBytes = await civilImages.front.arrayBuffer();
                    const backBytes = await civilImages.back.arrayBuffer();

                    const frontImage = await pdfDoc.embedJpg(frontBytes);
                    const backImage = await pdfDoc.embedJpg(backBytes);

                    // رسم الوجهين بالصفحة
                    page.drawImage(frontImage, { x: 100, y: 480, width: 395, height: 250 });
                    page.drawImage(backImage, { x: 100, y: 180, width: 395, height: 250 });
                } else {
                    // وضع المستندات المتعددة: كل صفحة بصورة مستقلة أو وراء بعض
                    for (let blob of multiPages) {
                        const page = pdfDoc.addPage([595.28, 841.89]);
                        const imgBytes = await blob.arrayBuffer();
                        const img = await pdfDoc.embedJpg(imgBytes);
                        
                        // ملء الصفحة بشكل متناسق
                        page.drawImage(img, { x: 50, y: 100, width: 495, height: 640 });
                    }
                }

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = (currentMode === 'civil' ? 'Civil_ID_' : 'Document_Scan_') + Date.now() + '.pdf';
                link.click();

                alert('تم إنشاء ملف الـ PDF وتنزيله بنجاح!');
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء دمج الملفات.');
            } finally {
                generatePdfBtn.disabled = false;
                generatePdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> دمج وتصدير الكل إلى ملف PDF';
            }
        });
    </script>
</body>
</html>
