<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أرشيف رصد - النسخة الإدارية المتكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-folder-tree"></i> منصة أرشيف رصد (الإصدار الذكي)
        </h1>
        <span class="text-sm bg-blue-800 px-3 py-1 rounded-full">نظام إداري متكامل</span>
    </header>

    <main class="max-w-4xl mx-auto p-6 flex flex-col gap-6 mt-4">

        <!-- أزرار اختيار وضع العمل -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-center gap-4">
            <button id="modeCivilBtn" onclick="switchMode('civil')" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white transition shadow-sm">
                <i class="fa-solid fa-id-card ml-1"></i> البطاقة المدنية (وجهين)
            </button>
            <button id="modeDocsBtn" onclick="switchMode('docs')" class="px-5 py-2.5 rounded-lg font-bold text-sm bg-slate-200 text-slate-700 transition shadow-sm">
                <i class="fa-solid fa-file-lines ml-1"></i> المستندات المتعددة
            </button>
        </div>

        <!-- إعدادات التسمية الذكية والفلترة والختم -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">نوع المستند (للتسمية الذكية):</label>
                <select id="docTypeSelect" class="w-full border rounded-lg p-2.5 text-xs focus:outline-none focus:border-blue-600 bg-slate-50 font-bold">
                    <option value="Civil_ID">بطاقة مدنية</option>
                    <option value="Residency">إقامة</option>
                    <option value="Contract">عقد عمل</option>
                    <option value="Passport">جواز سفر</option>
                    <option value="Official_Letter">مستند رسمي / كتاب</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم صاحب المستند / الملف:</label>
                <input type="text" id="docNameInput" placeholder="مثال: حسان محمود" class="w-full border rounded-lg p-2 text-xs focus:outline-none focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">العلامة المائية / الختم النصي:</label>
                <input type="text" id="watermarkText" placeholder="مثال: ستابيلو - مطابق للأصل" class="w-full border rounded-lg p-2 text-xs focus:outline-none focus:border-blue-600 bg-slate-50">
            </div>
        </div>

        <!-- زر تفعيل الفلتر -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="bwFilterToggle" class="w-4 h-4 text-blue-600 rounded">
                <span class="text-xs font-bold text-slate-700">تفعيل فلتر الماسح الضوئي (أبيض وأسود فائق الوضوح للكتابة)</span>
            </label>
        </div>

        <!-- قسم الكاميرا -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
            <h2 id="cameraTitle" class="font-bold text-lg text-blue-900 mb-3 w-full text-right border-b pb-2">تصوير الوجه الأمامي للبطاقة</h2>
            
            <div id="cameraContainer" class="w-full max-w-lg bg-black rounded-lg overflow-hidden relative aspect-[16/10] flex items-center justify-center border-2 border-blue-900 shadow-inner transition-all duration-300">
                <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
                
                <div id="guideFrame" class="absolute border-2 border-yellow-400 rounded-lg w-[85%] h-[75%] pointer-events-none flex items-center justify-center bg-yellow-400/5 shadow-lg">
                    <span id="guideText" class="absolute top-2 right-2 bg-black/70 text-yellow-300 text-[10px] px-2 py-0.5 rounded">ضع البطاقة هنا</span>
                </div>
            </div>

            <!-- أزرار البطاقة -->
            <div id="civilControls" class="flex gap-4 mt-4 w-full max-w-lg">
                <button id="captureFrontBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-bold transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> التقاط الأمامي
                </button>
                <button id="captureBackBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-lg font-bold transition shadow flex items-center justify-center gap-2" disabled>
                    <i class="fa-solid fa-camera-rotate"></i> التقاط الخلفي
                </button>
            </div>

            <!-- أزرار المستندات المتعددة -->
            <div id="docsControls" class="flex gap-4 mt-4 w-full max-w-lg hidden">
                <button id="capturePageBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-lg font-bold transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> التقاط صفحة جديدة
                </button>
            </div>
        </div>

        <!-- قسم المعاينة وإدارة الصفحات (مع زر الحذف X) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-md text-blue-900 mb-3 border-b pb-2">الملفات الملتقطة وإدارتها:</h3>
            <div id="previewContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <p class="text-xs text-slate-400 col-span-full text-center py-4">لم يتم التقاط أي صور بعد</p>
            </div>
        </div>

        <!-- زر الدمج والتصدير -->
        <button id="generatePdfBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 px-6 rounded-xl font-bold text-lg shadow transition disabled:bg-slate-300 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled>
            <i class="fa-solid fa-file-pdf"></i> دمج وتوليد ملف الـ PDF نهائياً
        </button>

        <!-- قسم المعاينة الحية للـ PDF -->
        <div id="previewPdfSection" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hidden flex flex-col gap-4">
            <h3 class="font-bold text-md text-blue-900 border-b pb-2 flex justify-between items-center">
                <span>معاينة المستند المدمج مباشرة</span>
                <span class="text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded">جاهز للاعتماد</span>
            </h3>
            <iframe id="pdfPreviewFrame" class="w-full h-96 rounded-lg border bg-slate-50"></iframe>
            <div class="flex gap-4">
                <a id="downloadPdfLink" class="flex-1 bg-blue-900 hover:bg-blue-800 text-white py-3 rounded-xl font-bold text-center transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> تحميل الملف على الجهاز
                </a>
            </div>
        </div>

        <!-- سجل الأرشيف المحلي (History) -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-md text-blue-900 mb-3 border-b pb-2 flex justify-between items-center">
                <span><i class="fa-solid fa-history ml-1"></i> سجل الأرشيف المحلي (آخر الملفات المؤرشفة)</span>
                <button onclick="clearHistory()" class="text-xs text-red-600 hover:underline">مسح السجل</button>
            </h3>
            <div id="historyContainer" class="flex flex-col gap-2">
                <p class="text-xs text-slate-400 text-center py-3">لا توجد عمليات أرشيف مسجلة حتى الآن</p>
            </div>
        </div>

    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const cameraContainer = document.getElementById('cameraContainer');
        const guideFrame = document.getElementById('guideFrame');
        const guideText = document.getElementById('guideText');
        
        const modeCivilBtn = document.getElementById('modeCivilBtn');
        const modeDocsBtn = document.getElementById('modeDocsBtn');
        const civilControls = document.getElementById('civilControls');
        const docsControls = document.getElementById('docsControls');
        const cameraTitle = document.getElementById('cameraTitle');
        
        const captureFrontBtn = document.getElementById('captureFrontBtn');
        const captureBackBtn = document.getElementById('captureBackBtn');
        const capturePageBtn = document.getElementById('capturePageBtn');
        const previewContainer = document.getElementById('previewContainer');
        const generatePdfBtn = document.getElementById('generatePdfBtn');
        
        const bwFilterToggle = document.getElementById('bwFilterToggle');
        const watermarkText = document.getElementById('watermarkText');
        const docTypeSelect = document.getElementById('docTypeSelect');
        const docNameInput = document.getElementById('docNameInput');

        const previewPdfSection = document.getElementById('previewPdfSection');
        const pdfPreviewFrame = document.getElementById('pdfPreviewFrame');
        const downloadPdfLink = document.getElementById('downloadPdfLink');
        const historyContainer = document.getElementById('historyContainer');

        let currentMode = 'civil';
        let civilImages = { front: null, back: null };
        let multiPages = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (e) {
                    alert('تعذر تشغيل الكاميرا.');
                }
            }
        }
        initCamera();

        function switchMode(mode) {
            currentMode = mode;
            civilImages = { front: null, back: null };
            multiPages = [];
            updatePreviewUI();
            generatePdfBtn.disabled = true;
            previewPdfSection.classList.add('hidden');

            if (mode === 'civil') {
                modeCivilBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white transition shadow-sm";
                modeDocsBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-slate-200 text-slate-700 transition shadow-sm";
                civilControls.classList.remove('hidden');
                docsControls.classList.add('hidden');
                cameraContainer.className = "w-full max-w-lg bg-black rounded-lg overflow-hidden relative aspect-[16/10] flex items-center justify-center border-2 border-blue-900 shadow-inner transition-all duration-300";
                guideFrame.className = "absolute border-2 border-yellow-400 rounded-lg w-[85%] h-[75%] pointer-events-none flex items-center justify-center bg-yellow-400/5 shadow-lg";
                guideText.textContent = "ضع البطاقة هنا";
                cameraTitle.textContent = "تصوير الوجه الأمامي للبطاقة";
                captureFrontBtn.disabled = false;
                captureFrontBtn.innerHTML = '<i class="fa-solid fa-camera"></i> التقاط الأمامي';
                captureBackBtn.disabled = true;
                captureBackBtn.innerHTML = '<i class="fa-solid fa-camera-rotate"></i> التقاط الخلفي';
            } else {
                modeDocsBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-emerald-600 text-white transition shadow-sm";
                modeCivilBtn.className = "px-5 py-2.5 rounded-lg font-bold text-sm bg-slate-200 text-slate-700 transition shadow-sm";
                docsControls.classList.remove('hidden');
                civilControls.classList.add('hidden');
                cameraContainer.className = "w-full max-w-lg bg-black rounded-lg overflow-hidden relative aspect-[3/4] flex items-center justify-center border-2 border-emerald-700 shadow-inner transition-all duration-300";
                guideFrame.className = "absolute border-2 border-emerald-400 rounded-lg w-[90%] h-[90%] pointer-events-none flex items-center justify-center bg-emerald-400/5 shadow-lg";
                guideText.textContent = "ضع المستند الطولي هنا";
                cameraTitle.textContent = "التقاط صفحات المستند (متعدد الصفحات)";
            }
        }

        function processCapturedImage(cropW, cropH, cropX, cropY) {
            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            if (bwFilterToggle.checked) {
                const imgData = ctx.getImageData(0, 0, cropW, cropH);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                    let val = avg > 130 ? 255 : 0; 
                    data[i] = val;     
                    data[i + 1] = val; 
                    data[i + 2] = val; 
                }
                ctx.putImageData(imgData, 0, 0);
            }

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const arr = dataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) { u8arr[n] = bstr.charCodeAt(n); }
            return { blob: new Blob([u8arr], {type: mime}), dataUrl };
        }

        function captureCivilCard() {
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const w = Math.floor(vw * 0.80);
            const h = Math.floor(w / 1.58);
            return processCapturedImage(w, h, Math.floor((vw - w) / 2), Math.floor((vh - h) / 2));
        }

        function captureDocumentPage() {
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const w = Math.floor(vw * 0.90);
            const h = Math.floor(vh * 0.90);
            return processCapturedImage(w, h, Math.floor((vw - w) / 2), Math.floor((vh - h) / 2));
        }

        captureFrontBtn.addEventListener('click', () => {
            const res = captureCivilCard();
            civilImages.front = res.blob;
            updatePreviewUI();
            captureFrontBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم الأمامي';
            captureFrontBtn.classList.replace('bg-blue-600', 'bg-green-600');
            captureBackBtn.disabled = false;
            cameraTitle.textContent = "تصوير الوجه الخلفي للبطاقة";
        });

        captureBackBtn.addEventListener('click', () => {
            const res = captureCivilCard();
            civilImages.back = res.blob;
            updatePreviewUI();
            captureBackBtn.innerHTML = '<i class="fa-solid fa-check text-green-300"></i> تم الخلفي';
            captureBackBtn.classList.replace('bg-indigo-600', 'bg-green-600');
            if (civilImages.front && civilImages.back) generatePdfBtn.disabled = false;
            cameraTitle.textContent = "تم تجهيز وجهي البطاقة بنجاح";
        });

        capturePageBtn.addEventListener('click', () => {
            const res = captureDocumentPage();
            multiPages.push(res.blob);
            updatePreviewUI();
            generatePdfBtn.disabled = false;
        });

        window.deleteItem = function(type, index) {
            if (type === 'front') {
                civilImages.front = null;
                captureFrontBtn.innerHTML = '<i class="fa-solid fa-camera"></i> التقاط الأمامي';
                captureFrontBtn.classList.replace('bg-green-600', 'bg-blue-600');
                generatePdfBtn.disabled = true;
            } else if (type === 'back') {
                civilImages.back = null;
                captureBackBtn.innerHTML = '<i class="fa-solid fa-camera-rotate"></i> التقاط الخلفي';
                captureBackBtn.classList.replace('bg-green-600', 'bg-indigo-600');
                generatePdfBtn.disabled = true;
            } else if (type === 'doc') {
                multiPages.splice(index, 1);
                if (multiPages.length === 0) generatePdfBtn.disabled = true;
            }
            updatePreviewUI();
            previewPdfSection.classList.add('hidden');
        };

        function updatePreviewUI() {
            previewContainer.innerHTML = '';
            if (currentMode === 'civil') {
                if (civilImages.front) appendPreview('الوجه الأمامي', URL.createObjectURL(civilImages.front), 'front', null);
                if (civilImages.back) appendPreview('الوجه الخلفي', URL.createObjectURL(civilImages.back), 'back', null);
                if (!civilImages.front && !civilImages.back) {
                    previewContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full text-center py-4">لم يتم التقاط أي صور للبطاقة بعد</p>';
                }
            } else {
                if (multiPages.length === 0) {
                    previewContainer.innerHTML = '<p class="text-xs text-slate-400 col-span-full text-center py-4">لم يتم التقاط أي صفحات بعد</p>';
                } else {
                    multiPages.forEach((blob, idx) => {
                        appendPreview(`صفحة (${idx + 1})`, URL.createObjectURL(blob), 'doc', idx);
                    });
                }
            }
        }

        function appendPreview(label, url, type, index) {
            const div = document.createElement('div');
            div.className = 'border rounded-lg p-2 flex flex-col items-center bg-slate-50 relative shadow-sm';
            let deleteParam = type === 'doc' ? `'doc', ${index}` : `'${type}', null`;
            let deleteBtnHtml = `<button onclick="deleteItem(${deleteParam})" class="absolute top-1 left-1 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-700 transition" title="حذف الصورة"><i class="fa-solid fa-xmark"></i></button>`;

            div.innerHTML = `
                ${deleteBtnHtml}
                <span class="text-xs font-bold text-slate-600 mb-1">${label}</span>
                <img src="${url}" class="h-24 object-contain rounded shadow border bg-white">
            `;
            previewContainer.appendChild(div);
        }

        // إدارة السجل المحلي وتخزينه بذاكرة المتصفح
        function saveToHistory(fileName) {
            let history = JSON.parse(localStorage.getItem('rasd_archive_history') || '[]');
            const newRecord = {
                name: fileName,
                date: new Date().toLocaleString('ar-KW'),
                mode: currentMode === 'civil' ? 'بطاقة مدنية' : 'مستندات متعددة'
            };
            history.unshift(newRecord);
            if (history.length > 10) history.pop(); // الاحتفاظ بآخر 10 عمليات فقط
            localStorage.setItem('rasd_archive_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('rasd_archive_history') || '[]');
            if (history.length === 0) {
                historyContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">لا توجد عمليات أرشيف مسجلة حتى الآن</p>';
                return;
            }
            historyContainer.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-xs';
                div.innerHTML = `
                    <span class="font-bold text-blue-900"><i class="fa-solid fa-file-pdf text-red-500 ml-1"></i> ${item.name}</span>
                    <span class="text-slate-500">${item.date} (${item.mode})</span>
                `;
                historyContainer.appendChild(div);
            });
        }

        window.clearHistory = function() {
            localStorage.removeItem('rasd_archive_history');
            loadHistory();
        }
        loadHistory();

        generatePdfBtn.addEventListener('click', async () => {
            generatePdfBtn.disabled = true;
            generatePdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري توليد ملف الـ PDF...';

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();

                if (currentMode === 'civil') {
                    const page = pdfDoc.addPage([595.28, 841.89]);
                    const frontBytes = await civilImages.front.arrayBuffer();
                    const backBytes = await civilImages.back.arrayBuffer();
                    const frontImage = await pdfDoc.embedJpg(frontBytes);
                    const backImage = await pdfDoc.embedJpg(backBytes);

                    const cardWidth = 420;
                    const cardHeight = 420 * (frontImage.height / frontImage.width);

                    page.drawImage(frontImage, { x: (595.28 - cardWidth) / 2, y: 480, width: cardWidth, height: cardHeight });
                    page.drawImage(backImage, { x: (595.28 - cardWidth) / 2, y: 180, width: cardWidth, height: cardHeight });
                } else {
                    for (let blob of multiPages) {
                        const page = pdfDoc.addPage([595.28, 841.89]);
                        const imgBytes = await blob.arrayBuffer();
                        const img = await pdfDoc.embedJpg(imgBytes);

                        const imgWidth = 495;
                        const imgHeight = 495 * (img.height / img.width);
                        page.drawImage(img, { 
                            x: (595.28 - imgWidth) / 2, 
                            y: (841.89 - imgHeight) / 2, 
                            width: imgWidth, 
                            height: imgHeight 
                        });
                    }
                }

                // العلامة المائية والختم الرقمي
                const wm = watermarkText.value.trim();
                if (wm) {
                    const pages = pdfDoc.getPages();
                    for (let p of pages) {
                        p.drawText(wm, {
                            x: 100,
                            y: 400,
                            size: 30,
                            color: PDFLib.rgb(0.8, 0.8, 0.8),
                            rotate: PDFLib.degrees(45),
                        });
                    }
                }

                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf'});
                const pdfUrl = URL.createObjectURL(blob);

                // بناء اسم الملف الذكي حسب اختيارك
                const docType = docTypeSelect.value;
                const personName = docNameInput.value.trim() ? '_' + docNameInput.value.trim().replace(/\s+/g, '_') : '';
                const finalFileName = `${docType}${personName}_${Date.now()}.pdf`;

                pdfPreviewFrame.src = pdfUrl;
                downloadPdfLink.href = pdfUrl;
                downloadPdfLink.download = finalFileName;
                
                previewPdfSection.classList.remove('hidden');
                previewPdfSection.scrollIntoView({ behavior: 'smooth' });

                // حفظ العملية في السجل المحلي
                saveToHistory(finalFileName);

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء معالجة الـ PDF.');
            } finally {
                generatePdfBtn.disabled = false;
                generatePdfBtn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> دمج وتوليد ملف الـ PDF نهائياً';
            }
        });
    </script>
</body>
</html>
